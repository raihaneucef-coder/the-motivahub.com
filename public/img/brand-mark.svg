<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Motiva Hub">
  <!--
    brand-mark-fixed.svg — COMPARISON CANDIDATE (Version 1), not referenced by
    any page yet. Diff vs public/img/brand-mark.svg (a73f52b):
      1. H glyph path rebuilt: the old path drew one stem + a bottom foot
         ("L"). New path = two stems + crossbar, 20u wide inside the 64u box.
      2. darkFace gradient re-tuned from #3a3a3a/#0a0a0a (1.00:1 on the dark
         hero = invisible) to bronze #a8874f -> #7a5f34 (>=3:1 on cream AND
         on the dark hero).
      3. goldFace, the M glyph, the 3 peaks, the up-arrow and the baseline are
         unchanged.
  -->
  <defs>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d896"/>
      <stop offset="35%" stop-color="#e0bc6c"/>
      <stop offset="65%" stop-color="#c79a45"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8874f"/>
      <stop offset="55%" stop-color="#8a6d3e"/>
      <stop offset="100%" stop-color="#7a5f34"/>
    </linearGradient>
  </defs>

  <g transform="translate(8, 4)">
    <path d="M 0 32 L 0 0 L 5 0 L 14 18 L 23 0 L 28 0 L 28 32 L 24 32 L 24 9 L 16 23 L 12 23 L 4 9 L 4 32 Z" fill="url(#goldFace)" stroke="#5a3e10" stroke-width="0.15"/>
  </g>

  <g transform="translate(38, 4)">
    <path d="M 0 32 L 0 0 L 4.5 0 L 4.5 13.5 L 15.5 13.5 L 15.5 0 L 20 0 L 20 32 L 15.5 32 L 15.5 18 L 4.5 18 L 4.5 32 Z" fill="url(#darkFace)" stroke="#5a3e10" stroke-width="0.15"/>
  </g>

  <g transform="translate(0, 30)">
    <path d="M 18 0 L 32 -10 L 38 -10 L 50 0 L 46 0 L 32 -7 L 22 0 Z" fill="url(#goldFace)" stroke="#5a3e10" stroke-width="0.1"/>
  </g>

  <g transform="translate(0, 44)">
    <path d="M 0 6 L 6 0 L 12 6 L 9 6 L 6 3 L 3 6 Z" fill="url(#goldFace)" stroke="#5a3e10" stroke-width="0.1"/>
    <path d="M 6 3 L 6 9" stroke="#c79a45" stroke-width="0.2"/>
    <path d="M 14 5 L 19 0 L 24 5 L 21 5 L 19 3 L 17 5 Z" fill="url(#goldFace)" stroke="#5a3e10" stroke-width="0.1"/>
    <path d="M 22 4 L 26 0 L 30 4 L 27 4 L 26 2 L 25 4 Z" fill="url(#goldFace)" stroke="#5a3e10" stroke-width="0.1"/>
  </g>

  <line x1="6" y1="58" x2="58" y2="58" stroke="url(#goldFace)" stroke-width="0.4" opacity="0.7"/>
</svg>
