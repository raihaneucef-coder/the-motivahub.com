<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Motiva Hub">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d896"/>
      <stop offset="35%" stop-color="#d4af5e"/>
      <stop offset="55%" stop-color="#b08a3e"/>
      <stop offset="100%" stop-color="#8a6a2a"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08a3e"/>
      <stop offset="50%" stop-color="#d4af5e"/>
      <stop offset="100%" stop-color="#7a5a20"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="darkSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.8" specularExponent="20" lighting-color="#fff5d8" result="spec">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <g filter="url(#emboss)">
    <path d="M 8 50 L 8 16 L 14 14 L 32 38 L 50 14 L 56 16 L 56 50 L 50 52 L 50 26 L 34 46 L 30 46 L 14 26 L 14 50 Z" fill="url(#gold)"/>
    <path d="M 8 50 L 8 16 L 14 14 L 32 38 L 50 14 L 56 16 L 56 50 L 50 52 L 50 26 L 34 46 L 30 46 L 14 26 L 14 50 Z" fill="none" stroke="#5a3e10" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 30 52 L 30 50 L 34 50 L 34 52 Z" fill="url(#dark)"/>
    <path d="M 30 50 L 30 48 L 34 48 L 34 50 Z" fill="url(#darkSide)"/>
  </g>

  <g filter="url(#emboss)">
    <path d="M 26 50 L 32 44 L 40 50 L 40 52 L 26 52 Z" fill="url(#dark)"/>
    <path d="M 26 50 L 32 44 L 40 50" fill="none" stroke="#3a3a3a" stroke-width="0.4" stroke-linejoin="round"/>
    <path d="M 32 44 L 40 50 L 40 52 L 26 52 L 26 50 L 32 44 Z" fill="url(#dark)" opacity="0.9"/>
    <path d="M 26 50 L 32 44 L 40 50" fill="none" stroke="#5a3e10" stroke-width="0.5" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <path d="M 20 22 L 26 14 L 32 22 L 38 14 L 44 22" fill="none" stroke="url(#goldSide)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="44" cy="14" r="1.6" fill="url(#gold)"/>

  <path d="M 8 56 L 56 56" stroke="url(#goldSide)" stroke-width="0.5" opacity="0.6"/>
</svg>
