<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Review - Local Images</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --ink: #0a0a0a;
      --muted: #6b665e;
      --line: #d8d1c0;
      --gold: #b8965a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; }
    .article-block {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .article-info h3 { font-size: 1.25rem; margin-bottom: 6px; }
    .article-slug { font-family: monospace; color: var(--muted); font-size: 0.9rem; }
    .article-topic { color: var(--gold); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    .article-current { margin-top: 8px; font-size: 0.85rem; color: var(--muted); }
    .article-current code { background: #f0ece3; padding: 2px 6px; border-radius: 4px; }
    .selection-status { margin-top: 8px; font-weight: 600; color: var(--muted); }
    .selection-status.selected { color: #2e7d32; }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .photo-option {
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: #faf7f0;
      transition: border-color 0.2s;
    }
    .photo-option:hover { border-color: var(--gold); }
    .photo-option.selected { border-color: #2e7d32; }
    .photo-option img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .photo-meta {
      padding: 8px 10px;
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .photo-id { font-family: monospace; font-weight: 600; }
    .select-btn {
      width: 100%;
      padding: 8px;
      border: none;
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .select-btn:hover { background: var(--gold); }
    .no-photos { color: var(--muted); padding: 16px; }
    .summary { margin-top: 40px; padding: 16px; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Photo Review</h1>
    <p class="subtitle">Choose from local images — no external API needed</p>
    <div id="articles"></div>
    <div class="summary" id="summary"></div>
  </div>

  <script>
    const articles = [
      {slug:"2-minute-rule-system",title:"The 2-Minute Rule: A Complete System, Not Just a Trick",topic:"Habits",currentImage:"/images/blog/two-minute-threshold.jpg"},
      {slug:"5-minute-morning-habit",title:"The 5-Minute Morning Habit That Saves My Sanity (And 4 Hours a Week)",topic:"Habits",currentImage:"/images/blog/the-morning-athlete.jpg"},
      {slug:"arreter-auto-sabotage",title:"How to Stop Self-Sabotaging Once and for All",topic:"Mindset",currentImage:"/images/blog/arreter-auto-sabotage.jpg"},
      {slug:"arreter-couper-avis",title:"How to Stop Caring What People Think of You",topic:"Confidence",currentImage:"/images/blog/confiance-inbranlable.jpg"},
      {slug:"athlete-discipline",title:"The Athlete's Discipline — What Sport Teaches About the Long Game",topic:"Discipline",currentImage:"/images/blog/athlete-discipline.jpg"},
      {slug:"atomic-habits-review",title:"I Read Atomic Habits 4 Times in 18 Months. Here's What Changed Each Time.",topic:"Habits",currentImage:"/images/blog/atomic-habits-review.jpg"},
      {slug:"atomic-habits-revue-complete",title:"Atomic Habits by James Clear — The Complete Breakdown",topic:"Habits",currentImage:"/images/blog/atomic-habits-revue.jpg"},
      {slug:"attention-as-asset",title:"Attention as Asset",topic:"Productivity",currentImage:"/images/blog/attention-as-asset.jpg"},
      {slug:"batching-productivite",title:"Batching: The Secret Weapon of Highly Productive People",topic:"Productivity",currentImage:"/images/blog/batching-productivite.jpg"},
      {slug:"beginner-again",title:"Go Where You Are a Beginner Again",topic:"Travel",currentImage:"/images/blog/beginner-again.jpg"},
      {slug:"body-votes-first",title:"Your Body Voted Before You Did — The Hidden Election That Runs Your Life",topic:"Sport",currentImage:"/images/blog/body-votes-first.jpg"},
      {slug:"boundaries-are-love",title:"Boundaries Are Love in Action: Why Saying No Is the Kindest Thing You Can Do",topic:"Relationships",currentImage:"/images/blog/boundaries-are-love.jpg"},
      {slug:"calm-is-a-superpower",title:"Calm Is a Superpower: How Composure Quietly Outperforms Talent",topic:"Wellness",currentImage:"/images/blog/calm-is-a-superpower.jpg"},
      {slug:"cant-hurt-me-review",title:"I Read Can't Hurt Me 3 Times. Here's What Goggins Won't Tell You.",topic:"Discipline",currentImage:"/images/blog/cant-hurt-me-review.jpg"},
      {slug:"casser-mauvaise-habitude",title:"How to Break a Bad Habit — The Reverse Four Laws",topic:"Habits",currentImage:"/images/blog/casser-mauvaise-habitude.jpg"}
    ];

    const allImages = [
      '/images/blog/2-minute-rule-system.jpg',
      '/images/blog/5-minute-morning-habit.jpg',
      '/images/blog/arreter-auto-sabotage.jpg',
      '/images/blog/arreter-couper-avis.jpg',
      '/images/blog/athlete-discipline.jpg',
      '/images/blog/atomic-habits-review.jpg',
      '/images/blog/atomic-habits-revue.jpg',
      '/images/blog/attention-as-asset.jpg',
      '/images/blog/batching-productivite.jpg',
      '/images/blog/beginner-again.jpg',
      '/images/blog/body-votes-first.jpg',
      '/images/blog/boundaries-are-love.jpg',
      '/images/blog/calm-is-a-superpower.jpg',
      '/images/blog/cant-hurt-me-review.jpg',
      '/images/blog/casser-mauvaise-habitude.jpg'
    ];

    const selections = {};

    function renderArticles() {
      const container = document.getElementById('articles');
      container.innerHTML = articles.map(a => {
        const options = allImages.filter(src => src !== a.currentImage).map(src => ({
          id: src.replace(/^\\/images\\/blog\\//, '').replace(/\\.jpg$/, ''),
          src: src
        }));
        const photosHtml = options.map(p => \`
          <div class="photo-option" data-slug="\${a.slug}" data-photo-id="\${p.id}" data-photo-src="\${p.src}">
            <img src="\${p.src}" alt="\${a.title}" loading="lazy" />
            <div class="photo-meta">
              <span class="photo-id">\${p.id}</span>
              <span>Local</span>
            </div>
            <button class="select-btn" onclick="selectPhoto('\${a.slug}', '\${p.id}', '\${p.src.replace(/'/g, "\\\\'")}')">Select</button>
          </div>
        \`).join('');
        return \`
          <div class="article-block" id="article-\${a.slug}">
            <div class="article-info">
              <h3>\${a.title}</h3>
              <p class="article-slug">\${a.slug}</p>
              <p class="article-topic">\${a.topic}</p>
              <p class="article-current">Current: <code>\${a.currentImage}</code></p>
              <div class="selection-status" id="status-\${a.slug}">Not selected</div>
            </div>
            <div class="photos-grid">\${photosHtml}</div>
          </div>
        \`;
      }).join('');
    }

    function selectPhoto(slug, photoId, photoSrc) {
      selections[slug] = { photoId, photoSrc };
      document.querySelectorAll('.photo-option').forEach(el => el.classList.remove('selected'));
      document.querySelectorAll('.photo-option[data-slug="' + slug + '"][data-photo-id="' + photoId + '"]').forEach(el => el.classList.add('selected'));
      const status = document.getElementById('status-' + slug);
      status.textContent = 'Selected: ' + photoId;
      status.classList.add('selected');
      updateSummary();
    }

    function updateSummary() {
      const count = Object.keys(selections).length;
      document.getElementById('summary').innerHTML = '<strong>Summary:</strong> ' + count + ' / ' + articles.length + ' articles selected';
    }

    renderArticles();
  </script>
</body>
</html>
