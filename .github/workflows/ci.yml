name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify key pages were emitted
        run: |
          test -f dist/index.html
          test -f dist/fr/index.html
          test -f dist/404.html
          test -f dist/sitemap-0.xml
          test -f dist/cookie-policy/index.html
          test -f dist/fr/cookie-policy/index.html
